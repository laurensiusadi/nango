# Nginx server block for self-hosted Nango — AS DEPLOYED.
#
# This is NOT a standalone nginx. On the Hetzner box, Nango is fronted by the
# existing `workmode-nginx-1` container, whose config lives at
# /opt/workmode/nginx.conf. Add the 443 block below into that file's `http {}`,
# and add `nango.workmode.now` to the existing port-80 ACME/redirect block's
# server_name list.
#
# Notes from the real deploy:
# - Nango binds to the docker bridge gateway 172.17.0.1 (BIND_ADDR), not
#   127.0.0.1 — that's how the nginx container reaches it (same as langfuse/
#   supabase blocks, which also proxy via 172.17.0.1).
# - Connect UI is served BY the main server on :3003 under /connect (because
#   FLAG_SERVE_CONNECT_UI=true), so NO separate subdomain/port is needed — the
#   single block below covers dashboard + API + Connect UI.
# - TLS uses a DEDICATED cert (cert-name nango.workmode.now), issued standalone:
#     docker stop workmode-nginx-1
#     docker run --rm -p 80:80 -v ./certbot/conf:/etc/letsencrypt \
#       -v ./certbot/logs:/var/log/letsencrypt certbot/certbot certonly \
#       --standalone --cert-name nango.workmode.now -d nango.workmode.now \
#       --non-interactive --agree-tos
#     docker start workmode-nginx-1
#   (The standalone flow was needed because expanding the shared workmode.now
#   cert kept hitting a stale-ACME-order "No such authorization" desync.)
# - After editing /opt/workmode/nginx.conf, RESTART the nginx container (not just
#   `nginx -s reload`): the config is a bind-mounted file and an in-place sed
#   edit changes the inode, so a reload alone serves the stale pre-edit content.

server {
    listen 443 ssl;
    server_name nango.workmode.now;

    ssl_certificate     /etc/letsencrypt/live/nango.workmode.now/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nango.workmode.now/privkey.pem;

    # Reuse the existing $block_scanner map from the main config.
    if ($block_scanner) {
        return 444;
    }

    location / {
        proxy_pass http://172.17.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (OAuth connect flow)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 120s;
    }
}
