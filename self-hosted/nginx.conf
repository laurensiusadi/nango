# Nginx server blocks for self-hosted Nango. Add to your existing Hetzner nginx
# stack (alongside the Workmode blocks). Assumes TLS via your existing cert
# tooling (certbot/acme). Adjust server_name + cert paths to your setup.
#
# Nango needs WebSocket upgrade for the OAuth connect flow — note the
# Upgrade/Connection headers below.

# Main server + dashboard + API
server {
    listen 443 ssl;
    server_name nango.workmode.now;

    ssl_certificate     /etc/letsencrypt/live/nango.workmode.now/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nango.workmode.now/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (OAuth connect flow)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Connect UI (embedded auth widget)
server {
    listen 443 ssl;
    server_name connect.nango.workmode.now;

    ssl_certificate     /etc/letsencrypt/live/connect.nango.workmode.now/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect.nango.workmode.now/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name nango.workmode.now connect.nango.workmode.now;
    return 301 https://$host$request_uri;
}
