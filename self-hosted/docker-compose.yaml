# Self-hosted Nango for Workmode, with the custom Accurate provider.
#
# Strategy: run the STOCK upstream image (pinned by tag) and bind-mount our
# generated providers.yaml + custom logo over it. No image builds — updating
# Nango is just bumping NANGO_IMAGE_TAG and re-pulling.
#
# Before `up`, generate the merged providers file:
#   node self-hosted/merge-providers.mjs
#
# Run from the repo root:
#   docker compose -f self-hosted/docker-compose.yaml --env-file self-hosted/.env up -d

services:
    nango-db:
        image: postgres:16.0-alpine
        container_name: nango-db
        environment:
            POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD}
            POSTGRES_USER: ${NANGO_DB_USER}
            POSTGRES_DB: ${NANGO_DB_NAME}
        volumes:
            - ./nango-data:/var/lib/postgresql/data
        restart: always
        networks:
            - nango

    nango-redis:
        image: redis:7.2.4
        container_name: nango-redis
        restart: always
        networks:
            - nango

    nango-server:
        # Pinned to a release tag — bump NANGO_IMAGE_TAG to update (see auto-update.sh).
        # Do NOT use ':hosted' in production; it floats and breaks reproducibility.
        image: nangohq/nango-server:${NANGO_IMAGE_TAG:-hosted}
        container_name: nango-server
        platform: linux/amd64
        environment:
            - NANGO_ENCRYPTION_KEY
            - NANGO_DB_USER
            - NANGO_DB_PASSWORD
            - NANGO_DB_HOST=${NANGO_DB_HOST:-nango-db}
            - NANGO_DB_NAME
            - NANGO_DB_SSL
            - RECORDS_DATABASE_URL=${RECORDS_DATABASE_URL:-postgresql://${NANGO_DB_USER}:${NANGO_DB_PASSWORD}@nango-db:5432/${NANGO_DB_NAME}}
            - SERVER_PORT=${SERVER_PORT:-3003}
            - NANGO_SERVER_URL=${NANGO_SERVER_URL}
            - NANGO_PUBLIC_SERVER_URL=${NANGO_PUBLIC_SERVER_URL}
            - NANGO_PUBLIC_CONNECT_URL=${NANGO_PUBLIC_CONNECT_URL}
            - NANGO_REDIS_URL=${NANGO_REDIS_URL:-redis://nango-redis:6379}
            - FLAG_AUTH_ENABLED=${FLAG_AUTH_ENABLED:-true}
            - NANGO_DASHBOARD_USERNAME
            - NANGO_DASHBOARD_PASSWORD
            - FLAG_SERVE_CONNECT_UI=${FLAG_SERVE_CONNECT_UI:-true}
            - LOG_LEVEL=${LOG_LEVEL:-info}
            - CSP_REPORT_ONLY=true
            - NANGO_LOGS_ENABLED=${NANGO_LOGS_ENABLED:-false}
        volumes:
            # Custom providers (upstream + accurate overlay), generated by merge-providers.mjs.
            - './build/providers.yaml:/app/nango/packages/providers/providers.yaml:ro'
            # Custom logo — webapp public/ is deleted at image-build time, so the
            # SVG must be injected into the built dist path at runtime.
            - './overlay/accurate.svg:/app/nango/packages/webapp/dist/images/template-logos/accurate.svg:ro'
        restart: always
        ports:
            - '${SERVER_PORT:-3003}:${SERVER_PORT:-3003}'
            - '${CONNECT_UI_PORT:-3009}:${CONNECT_UI_PORT:-3009}'
        depends_on:
            - nango-db
            - nango-redis
        networks:
            - nango

networks:
    nango:
